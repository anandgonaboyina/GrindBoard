<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Backup...</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #0f172a; 
            color: white; 
            text-align: center; 
        }
        .container { 
            max-width: 400px; 
            padding: 2.5rem; 
            border-radius: 1.5rem; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { 
            margin-top: 0; 
            font-size: 1.5rem; 
            color: #38bdf8; 
            margin-bottom: 0.5rem;
        }
        p { 
            color: rgba(255, 255, 255, 0.7); 
            line-height: 1.5; 
            font-size: 0.95rem;
            margin-bottom: 0;
        }
        .success-icon { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80; 
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1 id="title">Preparing Download...</h1>
        <p id="message">Your file will download automatically in a moment. You can safely close this tab afterwards.</p>
    </div>
<script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const dataStr = params.get('data');
            const apiId = params.get('apiId');
            let fileName = params.get('name') || 'backup';
            const type = params.get('type') || 'Backup';

            if (!fileName.endsWith('.json')) {
                fileName += '.json';
            }

            if (apiId || dataStr) {
                let timeLeft = 10;
                const titleEl = document.getElementById('title');
                const messageEl = document.getElementById('message');
                
                // Set initial downloading state
                titleEl.innerText = "Downloading " + type + "...";
                messageEl.innerText = `Please wait, completing in ${timeLeft} seconds...`;

                // Trigger download immediately
                if (apiId) {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = '/api/download-echo?id=' + apiId;
                    document.body.appendChild(iframe);
                } else if (dataStr) {
                    try {
                        const dataUri = "data:text/json;charset=utf-8," + dataStr;
                        const a = document.createElement('a');
                        a.href = dataUri;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } catch(e) {
                        titleEl.innerText = "Download Failed";
                        messageEl.innerText = "Your browser blocked the automatic download.";
                        return; // Stop execution if download fails
                    }
                }

                // Handle the 10-second UI countdown
                const countdown = setInterval(() => {
                    timeLeft -= 1;
                    messageEl.innerText = `Please wait, completing in ${timeLeft} seconds...`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        titleEl.innerText = type + " Downloaded!";
                        messageEl.innerText = "Check your browser's download folder. You can close this tab now.";
                    }
                }, 1000);

            } else {
                document.getElementById('title').innerText = "Invalid Request";
                document.getElementById('message').innerText = "No data was provided to download.";
                const icon = document.querySelector('.success-icon');
                icon.innerText = "!";
                icon.style.color = "#f87171";
                icon.style.background = "rgba(248, 113, 113, 0.2)";
            }
        };
    </script>
</body>
</html>
